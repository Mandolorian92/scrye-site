<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Scrye</title>
  <meta name="robots" content="noindex, nofollow" />
  <meta name="theme-color" content="#0A0B0D" />
  <link rel="icon" type="image/png" href="/assets/favicon.png" />
  <link rel="stylesheet" href="/styles.css?v=4" />
  <style>
    .nf { min-height: 100svh; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; gap: 20px; padding: 40px 22px; }
    .nf__mark { width: 76px; height: 76px; opacity: 0.95; }
    .nf__code { font-family: var(--font-mono); letter-spacing: 0.3em; text-transform: uppercase; font-size: 12px; color: var(--accent); margin: 6px 0 0; }
    .nf__title { font-size: clamp(2rem, 6vw, 3.4rem); font-weight: 700; letter-spacing: -0.03em; line-height: 1.05; margin: 0; }
    .nf__lead { color: var(--text-muted); max-width: 44ch; margin: 0; }
  </style>
</head>
<body>
  <main class="nf">
    <img class="nf__mark" src="/assets/scrye-mark.png" alt="Scrye" width="76" height="76" />
    <p class="nf__code">Error 404</p>
    <h1 class="nf__title">This page can't be found.</h1>
    <p class="nf__lead">The link may be broken, or the page may have moved.</p>
    <a class="btn btn--primary" href="/">Back to home</a>
  </main>
</body>
</html>
